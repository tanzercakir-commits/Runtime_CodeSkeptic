name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The expensive lanes still get exercised, just not on every commit.
  schedule:
    - cron: '17 4 * * 1'

# Publishing status as git refs needs write access to refs. The repository's
# default workflow permission is READ - set deliberately before going public -
# so it is granted here and nowhere else, and only for contents.
#
# A fork pull request gets a read-only GITHUB_TOKEN regardless of this line, which
# is why the publish step below excludes pull_request events entirely: without
# that, every external contribution would show a red CI job for a step that
# cannot succeed and has nothing to do with the contribution.
permissions:
  contents: write

jobs:
  # Linux only, and every push. GitHub bills these at 1x.
  #
  # macOS and Windows moved to `expensive-platforms` below, because this matrix
  # was the single largest thing in the repository and nobody had added up what
  # it cost. Every push to main started THREE macOS jobs - one here plus the two
  # in macos-probe.yml - and macOS bills at 10x, Windows at 2x: roughly 75
  # billable minutes per push, on a 3,000 minute monthly allowance.
  #
  # THE CAUSAL CLAIM THIS COMMENT USED TO MAKE WAS WRONG, and it is the third
  # copy of the same wrong claim in this repository. It said twenty pushes in one
  # night "exhausted a 2,000 minute monthly quota". The allowance is 3,000, and
  # the billing page for the month it happened reads:
  #
  #     CodeSkeptic          $32.52   82%
  #     Runtime_CodeSkeptic   $4.28   10.8%   <- this repository
  #     organon-mueller       $2.68
  #
  # This repository paid a tenth. The waste argument stands - 75 billable minutes
  # a push for a commit that edited a test comment is indefensible whoever is
  # paying - but "we ran out" was never ours to say.
  #
  # Worth recording HOW this copy survived: after the first two were corrected,
  # the sweep that claimed to have found "every quota claim in the repository"
  # was a line-based grep, and this claim spans a line break ("a 2,000" / "minute
  # monthly quota"). A systematic check that is not systematic is the shape of
  # error this project keeps finding in itself.
  #
  # The macOS entry here was pure duplication on top of that: macos-probe.yml
  # already builds and tests on macOS twice, natively and under Rosetta.
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "linux / gcc",     os: ubuntu-latest,  cc: gcc,   cxx: g++ }
          - { name: "linux / clang",   os: ubuntu-latest,  cc: clang, cxx: clang++ }

    steps:
      - uses: actions/checkout@v4
        with:
          # tools/guards/check_dates.py blames PROGRESS.md headings against the
          # commit that wrote them. actions/checkout defaults to fetch-depth: 1,
          # where blame attributes every line to HEAD - which produced thirteen
          # confident wrong accusations on 2026-07-26 and had been doing so
          # silently since the guard was added. The guard now skips lines blamed
          # to a shallow graft point; this makes sure the check is really
          # performed here rather than merely skipped everywhere.
          fetch-depth: 0

      - name: Configure
        id: configure
        shell: bash
        run: |
          # Warnings are errors in CI only. A contributor's local build should
          # not fail because their compiler version has a new diagnostic.
          EXTRA=""
          if [ -n "${{ matrix.cc }}" ]; then
            export CC=${{ matrix.cc }} CXX=${{ matrix.cxx }}
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DRS_WARNINGS_AS_ERRORS=ON $EXTRA

      - name: Build
        id: build
        run: cmake --build build --config RelWithDebInfo --parallel

      - name: Test
        id: test
        run: ctest --test-dir build --build-config RelWithDebInfo --output-on-failure

      # Project rules that can be checked mechanically. These matter as much as
      # the behavioural tests: a repository that has started lying about itself
      # passes every test right up until someone trusts a document.
      # tools/guards/run_all.sh records what each guard caught.
      - name: Project guards
        id: guards
        run: |
          python3 -m pip install --quiet --break-system-packages jsonschema \
            || python3 -m pip install --quiet jsonschema || true
          bash tools/guards/run_all.sh

      # POSIX-only: the case programs use mmap/mprotect/fork, and the probe is
      # not implemented for Windows.
      - name: Probe is reproducible across processes
        id: reproducible
        if: runner.os != 'Windows'
        run: |
          set -o pipefail
          mkdir -p /tmp/meas
          bash tools/campaign/check_reproducible.sh 2>&1 \
            | tee /tmp/meas/reproducible.txt

      # Before trusting the comparison, test the comparator. This exercises the
      # rows a real host never produces - `relocated`, a SUPPORTED prediction
      # meeting a refusal, a case that dies without printing.
      - name: Ground-truth harness selftest
        id: gt_selftest
        if: runner.os != 'Windows'
        run: bash tests/groundtruth/selftest.sh

      - name: Ground truth vs prediction
        id: gt_run
        if: runner.os != 'Windows'
        run: |
          set -o pipefail
          mkdir -p /tmp/meas
          build/bin/rs-env-probe vm --name gt-host --output /tmp/meas/gt-host.json
          # tee, not >: the output belongs in the job log AND in a file, because
          # the file is what gets published to refs/measurements/*. pipefail so
          # tee's success cannot mask the harness's exit code.
          bash tests/groundtruth/run.sh /tmp/meas/gt-host.json 2>&1 \
            | tee /tmp/meas/gt_run.txt

      # The probe is only implemented for Linux. On other platforms this step
      # proves the honest fallback: a schema-valid profile in which every fact
      # is unknown, and a non-zero warning list saying so.
      - name: Probe this host
        id: probe
        shell: bash
        run: |
          BIN=build/bin
          [ -x "$BIN/rs-env-probe" ] || BIN=build/bin/RelWithDebInfo
          "$BIN/rs-env-probe" vm --name "ci-${{ matrix.os }}" --output host-profile.json
          "$BIN/rs-profile" verify host-profile.json

      - name: Upload the measured profile
        uses: actions/upload-artifact@v4
        with:
          name: profile-${{ matrix.os }}-${{ matrix.cc || 'msvc' }}
          path: host-profile.json

  # macOS at 10x and Windows at 2x, so NOT on every commit. Weekly, or on
  # demand, or when a pull request is what you are about to merge.
  #
  # This is a real reduction in coverage per push and the honest trade is worth
  # stating: a portability break on Windows can now land on main and go unseen
  # for up to a week. That is acceptable while nothing in the project is
  # Windows-specific - the probe is `vm_probe_unimplemented.cpp` there - and it
  # stops being acceptable the moment a Windows probe exists. Revisit then.
  # WINDOWS AND macOS ON EVERY PUSH AGAIN, and the reason is measured.
  #
  # This job was gated off pushes to save billable minutes. That cost no longer
  # exists: the repository went public on 2026-07-26 and public repositories are
  # not billed for Actions - demonstrated rather than assumed, because a $10
  # repository-scoped Windows budget failed to lift the block over nine minutes
  # and two dispatches, and going public lifted it instantly.
  #
  # The gate had a price that was invisible until it was paid. Nothing built this
  # project with MSVC on a push to main: `build-and-test` above is Linux only,
  # and this job ran on pull requests and the weekly cron. This repository is
  # worked by direct pushes to main, so in practice Windows coverage was weekly.
  # `src/vm/impact.cpp` used `std::back_inserter` without `<iterator>` from
  # 87ffb6f until 3c49935 - green on gcc, clang, mingw and both macOS runners the
  # whole time, and broken on the only toolchain nobody was running.
  #
  # `tools/guards/check_includes.py` now catches that particular class without a
  # runner at all. This restores the coverage that would have caught it anyway.

      # Publish the outcome as a namespaced ref, so it is readable from a
      # development sandbox that can reach this repository over the git protocol
      # but not through the Actions API.
      #
      # This was missing and it cost. On 2026-07-26 the first real Windows build
      # failed on a missing <iterator>; the fix went in as 3c49935 and whether it
      # WORKED was invisible from inside - `ci.yml` published nothing, so
      # confirming a one-line fix required a person opening a browser. The
      # measurement workflows had this channel from the start; the workflow that
      # actually builds the code did not.
      #
      #   git ls-remote origin "refs/status/<sha>/*"
      # The other half of the channel, and it should have gone in with the first.
      #
      # `refs/status/*` answered "did it pass" within 55 seconds of being added -
      # and immediately reported linux/gcc, linux/clang and macos/apple-clang
      # failing on 1b58aed while windows/msvc passed. All three failures
      # reproduce nowhere locally: a fresh clone of the same commit builds,
      # passes 13 suites, all 10 guards, the ground-truth selftest and the
      # ground-truth comparison. So the reason is on the runner, and a status ref
      # cannot carry a reason.
      #
      # `macos-probe.yml` has had this step from the start. Copying only the
      # status half of a two-part channel is the kind of omission that looks
      # complete until it is used once.
      #
      #   git fetch origin "refs/ci-logs/<sha>/<job>:refs/heads/d" && git show d:steps.json
      # steps.json was `{}` in EVERY diagnostics ref this channel ever published,
      # and nobody noticed because nobody needed it until a failure had to be
      # attributed to a step. `toJSON(steps)` contains only steps that carry an
      # `id:`, and none of these did - so the file meant to say WHICH step failed
      # said nothing, and the answer had to be inferred from which later artifact
      # was missing. The load-bearing steps have ids now.
      - name: Failure diagnostics -> refs/ci-logs/*
        if: failure() && github.event_name != 'pull_request'
        shell: bash
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          slug="$(printf '%s' "${{ matrix.name }}" | tr -c 'A-Za-z0-9._-' '-')"
          mkdir -p /tmp/diag
          echo "$STEPS_JSON" > /tmp/diag/steps.json
          ctest --test-dir build --rerun-failed --output-on-failure \
            > /tmp/diag/ctest.txt 2>&1 || true
          tail -c 30000 /tmp/diag/ctest.txt > /tmp/diag/ctest_tail.txt || true
          bash tools/guards/run_all.sh > /tmp/diag/guards.txt 2>&1 || true
          bash tests/groundtruth/selftest.sh > /tmp/diag/gt_selftest.txt 2>&1 || true
          # The reproducibility check runs BEFORE the probe step, so when it is
          # the failure the diagnostics used to carry nothing about it: `gt_run.txt`
          # said "the probe step did not run" and the actual disagreement - two
          # profile_ids and the facts that differ - was only in the web log. That
          # is the position this channel exists to avoid.
          cp /tmp/meas/reproducible.txt /tmp/diag/reproducible.txt 2>/dev/null \
            || echo "(the reproducibility step did not run)" \
                 > /tmp/diag/reproducible.txt
          # The PROFILE, which the diagnostics did not carry - on a project whose
          # subject is what a probe measured, that is an odd thing to omit. When
          # ctest fails before the ground-truth step there is no profile in
          # /tmp/meas either, so make one directly; a probe that cannot run says so
          # in the file rather than leaving it absent.
          if [ -f /tmp/meas/gt-host.json ]; then
            cp /tmp/meas/gt-host.json /tmp/diag/profile.json
          else
            BIN=build/bin
            [ -x "$BIN/rs-env-probe" ] || BIN=build/bin/RelWithDebInfo
            "$BIN/rs-env-probe" vm --output /tmp/diag/profile.json 2>&1 \
              || echo '{"error":"the probe itself could not run"}' \
                   > /tmp/diag/profile.json
          fi
          if [ -f /tmp/meas/gt-host.json ]; then
            bash tests/groundtruth/run.sh /tmp/meas/gt-host.json \
              > /tmp/diag/gt_run.txt 2>&1 || true
          else
            echo "(no host profile: the probe step did not run)" > /tmp/diag/gt_run.txt
          fi
          git config user.name "ci-logs"
          git config user.email "ci-logs@localhost"
          git checkout --detach -q
          cp /tmp/diag/*.txt /tmp/diag/steps.json /tmp/diag/profile.json .
          git add -f steps.json ctest_tail.txt guards.txt gt_selftest.txt gt_run.txt reproducible.txt profile.json
          git commit -qm "${slug} diagnostics @ ${{ github.sha }}"
          git push --force origin \
            "HEAD:refs/ci-logs/${{ github.sha }}/${slug}"
      # A GREEN run can carry a first-ever measurement, and until now it threw it
      # away. `refs/ci-logs/*` publishes `if: failure()`, so on 2026-07-26 the run
      # that finally produced macOS ground-truth output - including whether native
      # arm64 raises SIGBUS where Rosetta 2 hands back zeroes, which nothing had
      # ever measured - was the run that discarded it. The failure channel was
      # right to exist and was answering the wrong question.
      #
      #   git ls-remote origin "refs/measurements/<sha>/*"
      #   git fetch origin "refs/measurements/<sha>/<slug>:refs/tmp/m"
      #   git show refs/tmp/m:gt_run.txt
      #
      # The commit holds ONLY these files - see tools/ci/publish_measurement.sh -
      # so this is cheap enough to run on every push, unlike the diagnostics refs
      # which carry a copy of the tree.
      - name: Publish measurements -> refs/measurements/*
        if: success() && runner.os != 'Windows' && github.event_name != 'pull_request'
        shell: bash
        run: |
          bash tools/ci/publish_measurement.sh measurements \
            "${{ matrix.name }}" "${{ github.sha }}" \
            /tmp/meas/gt_run.txt /tmp/meas/gt-host.json
      - name: Publish job status to refs/status/*
        if: always() && github.event_name != 'pull_request'
        shell: bash
        run: |
          slug="$(printf '%s' "${{ matrix.name }}" | tr -c 'A-Za-z0-9._-' '-')"
          state="${{ job.status }}"
          git config user.name "ci-status"
          git config user.email "ci-status@localhost"
          git checkout --detach -q
          git commit -q --allow-empty -m "${slug} ${state} @ ${{ github.sha }}"
          git push --force origin \
            "HEAD:refs/status/${{ github.sha }}/${slug}/${state}"
