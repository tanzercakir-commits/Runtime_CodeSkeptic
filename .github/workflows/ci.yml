  compatibility-gate:
    name: compatibility gate (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        id: build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build --parallel

      - name: Measure the host
        id: measure
        run: build/bin/rs-env-probe vm --name ci-linux --output host-profile.json

      # Demonstrates the exit-code contract end to end. Each requirement has a
      # documented expected outcome on a 64-bit Linux host; a mismatch means
      # either the analyzer or the platform changed, and both deserve a failed
      # build.
      - name: Evaluate shipped contracts
        id: contracts
        run: |
          set +e
          fail=0

          check () {
            local contract="$1" expected="$2" label="$3"
            build/bin/rs-check "$contract" --profile host-profile.json --quiet
            local code=$?
            if [ "$code" != "$expected" ]; then
              echo "::error::$label: expected exit $expected, got $code"
              fail=1
            else
              echo "ok: $label (exit $code)"
            fi
          }

          # Address above the user address space: proven impossible anywhere on
          # x86-64 Linux with 4-level paging.
          check contracts/emulator-highmem-guest-mapping.json 1 "high-memory guest mapping is UNSUPPORTED"

          # A JIT demanding simultaneous write+execute: allowed on stock Linux,
          # so this must NOT be reported as a contradiction here.
          check contracts/jit-code-buffer.json 0 "RWX JIT buffer is SUPPORTED on Linux"

          # Two-phase reserve/commit against a lazy-commit host: a semantic
          # mismatch, not an impossibility.
          check contracts/database-reserve-commit.json 2 "reserve/commit is CONDITIONALLY_SUPPORTED"

          exit $fail

      - name: Regression report against the unverified macOS fixture
        run: |
          build/bin/rs-check contracts/emulator-fixed-guest-mapping.json \
            --profile profiles/fixtures/macos-arm64-rosetta-x86_64.fixture.json \
            --format markdown --output fixture-report.md || true
          # The fixture's facts are heuristic_risk, so nothing derived from it
          # may claim PROVEN. This grep is the confidence ceiling as a CI gate.
          if grep -q "PROVEN" fixture-report.md; then
            echo "::error::a hand-authored fixture produced a PROVEN finding"
            exit 1
          fi
          cat fixture-report.md

      - uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            host-profile.json
            fixture-report.md

      # Publish the outcome as a namespaced ref, so it is readable from a
      # development sandbox that can reach this repository over the git protocol
      # but not through the Actions API.
      #
      # This was missing and it cost. On 2026-07-26 the first real Windows build
      # failed on a missing <iterator>; the fix went in as 3c49935 and whether it
      # WORKED was invisible from inside - `ci.yml` published nothing, so
      # confirming a one-line fix required a person opening a browser. The
      # measurement workflows had this channel from the start; the workflow that
      # actually builds the code did not.
      #
      #   git ls-remote origin "refs/status/<sha>/*"
      # The other half of the channel, and it should have gone in with the first.
      #
      # `refs/status/*` answered "did it pass" within 55 seconds of being added -
      # and immediately reported linux/gcc, linux/clang and macos/apple-clang
      # failing on 1b58aed while windows/msvc passed. All three failures
      # reproduce nowhere locally: a fresh clone of the same commit builds,
      # passes 13 suites, all 10 guards, the ground-truth selftest and the
      # ground-truth comparison. So the reason is on the runner, and a status ref
      # cannot carry a reason.
      #
      # `macos-probe.yml` has had this step from the start. Copying only the
      # status half of a two-part channel is the kind of omission that looks
      # complete until it is used once.
      #
      #   git fetch origin "refs/ci-logs/<sha>/<job>:refs/heads/d" && git show d:steps.json
      - name: Failure diagnostics -> refs/ci-logs/*
        if: failure() && github.event_name != 'pull_request'
        shell: bash
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          slug="$(printf '%s' "compatibility-gate" | tr -c 'A-Za-z0-9._-' '-')"
          mkdir -p /tmp/diag
          echo "$STEPS_JSON" > /tmp/diag/steps.json
          ctest --test-dir build --rerun-failed --output-on-failure \
            > /tmp/diag/ctest.txt 2>&1 || true
          tail -c 30000 /tmp/diag/ctest.txt > /tmp/diag/ctest_tail.txt || true
          bash tools/guards/run_all.sh > /tmp/diag/guards.txt 2>&1 || true
          bash tests/groundtruth/selftest.sh > /tmp/diag/gt_selftest.txt 2>&1 || true
          # The reproducibility check runs BEFORE the probe step, so when it is
          # the failure the diagnostics used to carry nothing about it: `gt_run.txt`
          # said "the probe step did not run" and the actual disagreement - two
          # profile_ids and the facts that differ - was only in the web log. That
          # is the position this channel exists to avoid.
          cp /tmp/meas/reproducible.txt /tmp/diag/reproducible.txt 2>/dev/null \
            || echo "(the reproducibility step did not run)" \
                 > /tmp/diag/reproducible.txt
          # The PROFILE, which the diagnostics did not carry - on a project whose
          # subject is what a probe measured, that is an odd thing to omit. When
          # ctest fails before the ground-truth step there is no profile in
          # /tmp/meas either, so make one directly; a probe that cannot run says so
          # in the file rather than leaving it absent.
          if [ -f /tmp/meas/gt-host.json ]; then
            cp /tmp/meas/gt-host.json /tmp/diag/profile.json
          else
            BIN=build/bin
            [ -x "$BIN/rs-env-probe" ] || BIN=build/bin/RelWithDebInfo
            "$BIN/rs-env-probe" vm --output /tmp/diag/profile.json 2>&1 \
              || echo '{"error":"the probe itself could not run"}' \
                   > /tmp/diag/profile.json
          fi
          if [ -f /tmp/meas/gt-host.json ]; then
            bash tests/groundtruth/run.sh /tmp/meas/gt-host.json \
              > /tmp/diag/gt_run.txt 2>&1 || true
          else
            echo "(no host profile: the probe step did not run)" > /tmp/diag/gt_run.txt
          fi
          git config user.name "ci-logs"
          git config user.email "ci-logs@localhost"
          git checkout --detach -q
          cp /tmp/diag/*.txt /tmp/diag/steps.json /tmp/diag/profile.json .
          git add -f steps.json ctest_tail.txt guards.txt gt_selftest.txt gt_run.txt reproducible.txt profile.json
          git commit -qm "${slug} diagnostics @ ${{ github.sha }}"
          git push --force origin \
            "HEAD:refs/ci-logs/${{ github.sha }}/${slug}"
      # The gate measures the host too, and its profile is the one the shipped
      # contracts were evaluated against - so it is the measurement most worth
      # being able to read back. See the note in build-and-test above.
      - name: Publish measurements -> refs/measurements/*
        if: success() && github.event_name != 'pull_request'
        shell: bash
        run: |
          bash tools/ci/publish_measurement.sh measurements \
            "compatibility-gate" "${{ github.sha }}" host-profile.json
      - name: Publish job status to refs/status/*
        if: always() && github.event_name != 'pull_request'
        shell: bash
        run: |
          slug="$(printf '%s' "compatibility-gate" | tr -c 'A-Za-z0-9._-' '-')"
          state="${{ job.status }}"
          git config user.name "ci-status"
          git config user.email "ci-status@localhost"
          git checkout --detach -q
          git commit -q --allow-empty -m "${slug} ${state} @ ${{ github.sha }}"
          git push --force origin \
            "HEAD:refs/status/${{ github.sha }}/${slug}/${state}"

  determinism:
    name: determinism
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build --parallel

      # Phase 1 exit criterion: repeated runs on the same stable host produce
      # equivalent canonical profiles.
      - name: Two probe runs must agree
        run: |
          build/bin/rs-env-probe vm --name a --output a.json
          build/bin/rs-env-probe vm --name b --output b.json
          ida=$(build/bin/rs-profile id a.json)
          idb=$(build/bin/rs-profile id b.json)
          echo "A: $ida"
          echo "B: $idb"
          [ "$ida" = "$idb" ] || { echo "::error::profile_id is not stable across runs"; exit 1; }
          build/bin/rs-profile diff a.json b.json

      - name: Canonical form must survive a round trip
        run: |
          build/bin/rs-env-probe vm --name rt --canonical --output c1.json
          id1=$(build/bin/rs-profile id c1.json)
          # Re-reading and re-serializing must not change the identity.
          id2=$(build/bin/rs-profile id c1.json)
          [ "$id1" = "$id2" ] || { echo "::error::profile_id changed on re-read"; exit 1; }

      # Publish the outcome as a namespaced ref, so it is readable from a
      # development sandbox that can reach this repository over the git protocol
      # but not through the Actions API.
      #
      # This was missing and it cost. On 2026-07-26 the first real Windows build
      # failed on a missing <iterator>; the fix went in as 3c49935 and whether it
      # WORKED was invisible from inside - `ci.yml` published nothing, so
      # confirming a one-line fix required a person opening a browser. The
      # measurement workflows had this channel from the start; the workflow that
      # actually builds the code did not.
      #
      #   git ls-remote origin "refs/status/<sha>/*"
      # The other half of the channel, and it should have gone in with the first.
      #
      # `refs/status/*` answered "did it pass" within 55 seconds of being added -
      # and immediately reported linux/gcc, linux/clang and macos/apple-clang
      # failing on 1b58aed while windows/msvc passed. All three failures
      # reproduce nowhere locally: a fresh clone of the same commit builds,
      # passes 13 suites, all 10 guards, the ground-truth selftest and the
      # ground-truth comparison. So the reason is on the runner, and a status ref
      # cannot carry a reason.
      #
      # `macos-probe.yml` has had this step from the start. Copying only the
      # status half of a two-part channel is the kind of omission that looks
      # complete until it is used once.
      #
      #   git fetch origin "refs/ci-logs/<sha>/<job>:refs/heads/d" && git show d:steps.json
      - name: Failure diagnostics -> refs/ci-logs/*
        if: failure() && github.event_name != 'pull_request'
        shell: bash
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          slug="$(printf '%s' "determinism" | tr -c 'A-Za-z0-9._-' '-')"
          mkdir -p /tmp/diag
          echo "$STEPS_JSON" > /tmp/diag/steps.json
          ctest --test-dir build --rerun-failed --output-on-failure \
            > /tmp/diag/ctest.txt 2>&1 || true
          tail -c 30000 /tmp/diag/ctest.txt > /tmp/diag/ctest_tail.txt || true
          bash tools/guards/run_all.sh > /tmp/diag/guards.txt 2>&1 || true
          bash tests/groundtruth/selftest.sh > /tmp/diag/gt_selftest.txt 2>&1 || true
          # The reproducibility check runs BEFORE the probe step, so when it is
          # the failure the diagnostics used to carry nothing about it: `gt_run.txt`
          # said "the probe step did not run" and the actual disagreement - two
          # profile_ids and the facts that differ - was only in the web log. That
          # is the position this channel exists to avoid.
          cp /tmp/meas/reproducible.txt /tmp/diag/reproducible.txt 2>/dev/null \
            || echo "(the reproducibility step did not run)" \
                 > /tmp/diag/reproducible.txt
          # The PROFILE, which the diagnostics did not carry - on a project whose
          # subject is what a probe measured, that is an odd thing to omit. When
          # ctest fails before the ground-truth step there is no profile in
          # /tmp/meas either, so make one directly; a probe that cannot run says so
          # in the file rather than leaving it absent.
          if [ -f /tmp/meas/gt-host.json ]; then
            cp /tmp/meas/gt-host.json /tmp/diag/profile.json
          else
            BIN=build/bin
            [ -x "$BIN/rs-env-probe" ] || BIN=build/bin/RelWithDebInfo
            "$BIN/rs-env-probe" vm --output /tmp/diag/profile.json 2>&1 \
              || echo '{"error":"the probe itself could not run"}' \
                   > /tmp/diag/profile.json
          fi
          if [ -f /tmp/meas/gt-host.json ]; then
            bash tests/groundtruth/run.sh /tmp/meas/gt-host.json \
              > /tmp/diag/gt_run.txt 2>&1 || true
          else
            echo "(no host profile: the probe step did not run)" > /tmp/diag/gt_run.txt
          fi
          git config user.name "ci-logs"
          git config user.email "ci-logs@localhost"
          git checkout --detach -q
          cp /tmp/diag/*.txt /tmp/diag/steps.json /tmp/diag/profile.json .
          git add -f steps.json ctest_tail.txt guards.txt gt_selftest.txt gt_run.txt reproducible.txt profile.json
          git commit -qm "${slug} diagnostics @ ${{ github.sha }}"
          git push --force origin \
            "HEAD:refs/ci-logs/${{ github.sha }}/${slug}"
      - name: Publish job status to refs/status/*
        if: always() && github.event_name != 'pull_request'
        shell: bash
        run: |
          slug="$(printf '%s' "determinism" | tr -c 'A-Za-z0-9._-' '-')"
          state="${{ job.status }}"
          git config user.name "ci-status"
          git config user.email "ci-status@localhost"
          git checkout --detach -q
          git commit -q --allow-empty -m "${slug} ${state} @ ${{ github.sha }}"
          git push --force origin \
            "HEAD:refs/status/${{ github.sha }}/${slug}/${state}"
