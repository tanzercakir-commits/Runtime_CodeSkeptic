name: macOS measurement

# The point of this workflow is EVIDENCE, not a green tick.
#
# Every headline claim in this project is about macOS - the Rosetta 2 GPU
# carveout, 16 KiB pages, write-xor-execute, the JIT entitlement - and until
# this workflow existed, none of it had been measured. Three hand-authored
# fixtures carried the load, all capped at PREDICTIVE or OBSERVED_INVARIANT
# because nobody had run a probe.
#
# This runs the probe on a real Apple Silicon runner, natively and (where
# Rosetta 2 is present) as a translated x86-64 process, and uploads both
# profiles. Those artifacts are the first measured macOS facts the project
# has ever had.

# GitHub bills macOS runners at 10x and this workflow starts two of them, so it
# does NOT run on push.
#
# That is a deliberate reversal, and the REASON FIRST GIVEN FOR IT WAS WRONG.
#
# What this comment used to say: three macOS jobs per push (one from ci.yml, two
# here) at 10x, roughly 75 billable minutes a push, twenty pushes in a night,
# "and a 2,000 minute monthly quota gone" - so the workflow was pulled off
# per-push because its own arithmetic had burned the account's minutes.
#
# The billing page, read on 2026-07-26, says otherwise on both counts:
#
#   the quota is 3,000 minutes, not 2,000   (Pro tier)
#   this month's usage, by repository:
#     CodeSkeptic            $32.52   82%
#     Runtime_CodeSkeptic     $4.28   10.8%   <- this repository
#     organon-mueller         $2.68
#
# **This repository did not exhaust the quota. It paid about a tenth of the
# bill.** The sibling repository runs five workflows per push - CI, Windows,
# Docker, a Juliet benchmark and Docs - and its last heavy day was 2026-07-24,
# immediately before this repository hit the wall at 2026-07-25T01:09:39Z.
# Adjacency in time was read as cause, from arithmetic that was never checked
# against the one page that had the answer.
#
# THE DECISION STANDS AND THE REASONING IS DIFFERENT. Three macOS jobs per push
# at 10x is wasteful whoever is paying, and the case for per-push measurement was
# never strong: the HOST cannot change between two commits. What changes is the
# probe and the analyzer, and a weekly run plus a button covers that. That is a
# sound argument about waste. It is not the argument that "we ran out", which was
# not ours to make.
#
# Worth leaving in the file rather than tidying away, because this project's own
# rule is not to attribute without measuring, and the measurement was one page
# away. See docs/PROGRESS.md.
#
#   schedule           one measurement a week, unattended
#   workflow_dispatch   press Run workflow when you want one now
#
# If a measurement is needed for a specific commit, dispatch it against that
# ref. The trade is real and worth stating: a probe change can now sit on main
# for up to a week before any Apple Silicon host has run it.
#
# 2026-07-26, AND THE COST ARGUMENT ABOVE IS NOW VOID. The repository is public, so
# standard GitHub-hosted runners - macOS included - are free for it. The 10x
# multiplier the paragraphs above reason about no longer applies to this repository
# at all. The arithmetic was right; the premise expired.
#
# The SECOND argument survives and is why this is a path filter rather than a plain
# push trigger: "the HOST cannot change between two commits. What changes is the
# probe and the analyzer." A documentation commit still has nothing to measure. So
# it runs when something that can change a measurement changes - which is exactly
# what `windows-probe.yml` already does, and what would have caught the Rosetta
# harness bug on the commit that introduced it rather than months later.
#
# `tests/groundtruth/` is in the list because the Rosetta lane runs the ground-truth
# harness, and the bug that broke that lane was in the harness, not in the probe.
on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/macos-probe.yml'
      - 'src/probe/vm_probe_macos.cpp'
      # The file that can silently replace the probe - see the same list in
      # windows-probe.yml, where its absence hid a fix from its own confirmation.
      - 'src/probe/vm_probe_unimplemented.cpp'
      - 'src/probe/arena_walk.cpp'
      - 'include/runtimeskeptic/probe/arena_walk.hpp'
      - 'include/runtimeskeptic/probe/vm_probe.hpp'
      # Platform detection lives here and nowhere else.
      - 'CMakeLists.txt'
      - 'src/CMakeLists.txt'
      # The Rosetta lane runs this, and this is where it broke.
      - 'tests/groundtruth/run.sh'
      - 'tests/groundtruth/selftest.sh'

# Publishing measurements and job status as git refs needs push rights.
permissions:
  contents: write

concurrency:
  group: macos-probe-${{ github.ref }}
  # NOT cancel-in-progress. This workflow's output is a measurement, and the
  # measurement IS the artifact - killing a run partway through measuring a real
  # Apple Silicon host, in order to start a newer one, throws away evidence that
  # cannot be reconstructed from the development sandbox.
  #
  # It also explains a gap in the record: 8dd6834 published no measurement and
  # no status refs, because the next push landed while it was still running.
  # A queued second run costs runner minutes; a discarded measurement costs a
  # data point.
  cancel-in-progress: false

jobs:
  native-arm64:
    name: native arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --build-config RelWithDebInfo --output-on-failure

      # ctest's reproducibility test calls the probe twice in ONE process, so
      # it cannot see anything ASLR decides at exec time. This runs two.
      - name: Probe is reproducible across processes
        run: |
          bash tools/campaign/check_reproducible.sh 2>&1 | tee /tmp/reproducible.txt
          exit "${PIPESTATUS[0]}"

      - name: Confirm this is really Apple Silicon
        run: |
          uname -m
          sysctl -n hw.optional.arm64 || echo "hw.optional.arm64 absent"
          sysctl -n kern.osproductversion

      - name: Measure
        id: measure
        run: |
          build/bin/rs-env-probe vm --name "macos-arm64-native-ci" \
            --output macos-arm64-native.json
          build/bin/rs-profile verify macos-arm64-native.json

      # The only test that checks whether the tool is RIGHT rather than merely
      # coherent: run the request for real and compare.
      - name: Ground truth vs prediction
        if: steps.measure.outcome == 'success'
        run: |
          bash tests/groundtruth/run.sh macos-arm64-native.json 2>&1 \
            | tee /tmp/groundtruth.txt
          exit "${PIPESTATUS[0]}"

      # The facts this project has been guessing at for its entire life.
      - name: Report what was measured
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open("macos-arm64-native.json"))
          vm = d["virtual_memory"]
          p = d["platform"]
          print(f"os            : {p['os_version']}")
          print(f"host arch     : {p['host_arch']}   process arch: {p['process_arch']}")
          print(f"translation   : {p['translation_mode']}")
          for k in ("page_size", "allocation_granularity", "min_map_address",
                    "max_user_address", "exact_mapping",
                    "fixed_noreplace_available", "file_map_beyond_eof"):
              f = vm[k]
              print(f"{k:26} {str(f['value']):22} {f['evidence']}")
          for k, f in vm["protection"].items():
              print(f"{k:26} {str(f['value']):22} {f['evidence']}")
          print(f"available ranges  : {len(vm['available_ranges'])}")
          print(f"unavailable ranges: {len(vm['unavailable_ranges'])}")
          for r in vm["unavailable_ranges"]:
              print(f"  UNAVAILABLE {r['start']} .. {r['end']}  {r['note']}")
          PY

      - uses: actions/upload-artifact@v4
        if: always() && steps.measure.outcome == 'success'
        with:
          name: macos-arm64-native-profile
          path: macos-arm64-native.json

      # The development sandbox for this project can reach the repository over
      # the git protocol only - no Actions REST API, no artifact downloads. So
      # the two things worth reading are published as namespaced refs, which
      # are invisible as branches and trigger nothing:
      #
      #   refs/measurements/<sha>/<job>   the measured profile itself
      #   refs/status/<sha>/<job>/<state> the job's conclusion
      #
      # Fetch one with:
      #   git fetch origin "refs/measurements/<sha>/<job>:refs/heads/m" && git show m:PROFILE.json
      # Via the shared script, so this ref holds ONLY the artifacts. It used to
      # `git add` on top of the checked-out tree, which meant every measurement
      # ref carried a full copy of the repository - and the ground-truth output,
      # the thing this workflow exists to produce, was not in it at all.
      - name: Publish the measurement to refs/measurements/*
        if: always() && steps.measure.outcome == 'success'
        run: |
          bash tools/ci/publish_measurement.sh measurements \
            "native-arm64" "${{ github.sha }}" \
            macos-arm64-native.json /tmp/groundtruth.txt /tmp/reproducible.txt

      - name: Failure diagnostics -> refs/ci-logs/*
        if: failure()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          mkdir -p /tmp/diag
          echo "$STEPS_JSON" > /tmp/diag/steps.json
          ctest --test-dir build --build-config RelWithDebInfo \
            --rerun-failed --output-on-failure \
            > /tmp/diag/ctest_failed.txt 2>&1 || true
          tail -c 30000 /tmp/diag/ctest_failed.txt > /tmp/diag/ctest_tail.txt || true
          cp /tmp/reproducible.txt /tmp/diag/reproducible.txt 2>/dev/null \
            || echo "(the reproducibility step did not run)" > /tmp/diag/reproducible.txt
          cp /tmp/groundtruth.txt /tmp/diag/groundtruth.txt 2>/dev/null \
            || echo "(the ground-truth step did not run)" > /tmp/diag/groundtruth.txt
          git config user.name "ci-logs"
          git config user.email "ci-logs@localhost"
          git checkout --detach -q
          cp /tmp/diag/steps.json /tmp/diag/ctest_tail.txt \
             /tmp/diag/reproducible.txt /tmp/diag/groundtruth.txt .
          git add -f steps.json ctest_tail.txt reproducible.txt groundtruth.txt
          git commit -qm "macos diagnostics @ ${{ github.sha }}"
          git push --force origin \
            "HEAD:refs/ci-logs/${{ github.sha }}/native-arm64"

      - name: Mirror job status to refs/status/*
        if: always()
        run: |
          git push --force origin \
            "HEAD:refs/status/${{ github.sha }}/native-arm64/${{ job.status }}"

  rosetta-x86_64:
    name: x86-64 under Rosetta 2
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # Rosetta 2 may or may not be installed on a hosted runner. If it is
      # absent the job reports that plainly and stops; a missing translator is
      # a fact about the runner, not a build failure, and pretending otherwise
      # would be exactly the kind of laundering this project exists to catch.
      - name: Is Rosetta 2 available?
        id: rosetta
        run: |
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Rosetta 2 is present."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Rosetta 2 is not available on this runner; the translated measurement was skipped. The macOS/Rosetta claims in this repository remain unmeasured."
          fi

      - name: Build as x86-64
        if: steps.rosetta.outputs.available == 'true'
        run: |
          cmake -S . -B build-x64 -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                -DCMAKE_OSX_ARCHITECTURES=x86_64
          cmake --build build-x64 --parallel

      - name: Confirm the binary really is x86-64
        if: steps.rosetta.outputs.available == 'true'
        run: |
          file build-x64/bin/rs-env-probe
          file build-x64/bin/rs-env-probe | grep -q x86_64

      - name: Test under translation
        if: steps.rosetta.outputs.available == 'true'
        run: ctest --test-dir build-x64 --build-config RelWithDebInfo --output-on-failure

      - name: Probe is reproducible across processes (x86-64)
        run: |
          PROBE=build-x64/bin/rs-env-probe \
          PROFILE_TOOL=build-x64/bin/rs-profile \
            bash tools/campaign/check_reproducible.sh 2>&1 | tee /tmp/reproducible.txt
          exit "${PIPESTATUS[0]}"

      # This is the measurement the whole project has been waiting for.
      - name: Measure the translated address space
        id: measure
        if: steps.rosetta.outputs.available == 'true'
        run: |
          build-x64/bin/rs-env-probe vm --name "macos-arm64-rosetta-x86_64-ci" \
            --output macos-rosetta-x86_64.json
          build-x64/bin/rs-profile verify macos-rosetta-x86_64.json

      # Built with the x86-64 toolchain so the case programs are translated
      # too - a ground-truth run whose cases are native while the profile is
      # translated would compare two different machines.
      - name: Ground truth vs prediction (x86-64)
        if: steps.rosetta.outputs.available == 'true'
        run: |
          RS_CHECK=build-x64/bin/rs-check \
          GT_BIN=build-x64/groundtruth \
          CC="cc -arch x86_64" \
            bash tests/groundtruth/run.sh macos-rosetta-x86_64.json 2>&1 \
              | tee /tmp/groundtruth.txt
          exit "${PIPESTATUS[0]}"

      - name: Did the probe agree that it was translated?
        if: steps.rosetta.outputs.available == 'true'
        run: |
          python3 - <<'PY'
          import json, sys
          d = json.load(open("macos-rosetta-x86_64.json"))
          p = d["platform"]
          print(f"process arch : {p['process_arch']}")
          print(f"host arch    : {p['host_arch']}")
          print(f"translation  : {p['translation_mode']}")
          if p["translation_mode"] != "rosetta2":
              print("::error::the probe did not detect Rosetta 2 in a translated process")
              sys.exit(1)
          PY

      # The three fixtures claim a reserved band at 0x1000000000-0x7000000000
      # and a commpage below it. Now we find out. Either outcome is a result:
      # confirmation upgrades those facts from heuristic_risk to
      # measured_capability, and refutation means the fixtures are wrong and
      # must be corrected.
      - name: What did it find in the reported reserved bands?
        if: steps.rosetta.outputs.available == 'true'
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open("macos-rosetta-x86_64.json"))
          vm = d["virtual_memory"]
          print(f"page size   : {vm['page_size']['value']}")
          print(f"min mappable: {vm['min_map_address']['value']}")
          print(f"max user    : {vm['max_user_address']['value']}")
          print()

          def covered(ranges, addr):
              return [r for r in ranges
                      if int(r["start"], 16) <= addr < int(r["end"], 16)]

          watch = {
              "commpage start      0xfc0000000": 0xfc0000000,
              "GPU carveout start  0x1000000000": 0x1000000000,
              "GTA V target        0x1307200000": 0x1307200000,
              "carveout mid        0x4000000000": 0x4000000000,
              "reported end        0x6fc0000000": 0x6fc0000000,
              "shadPS4 USER_MIN    0x7000000000": 0x7000000000,
          }
          for label, addr in watch.items():
              un = covered(vm["unavailable_ranges"], addr)
              av = covered(vm["available_ranges"], addr)
              if un:
                  print(f"  REFUSED   {label}   ({un[0]['note'][:60]})")
              elif av:
                  print(f"  AVAILABLE {label}")
              else:
                  print(f"  untested  {label}")

          print()
          print("unavailable ranges measured:")
          for r in vm["unavailable_ranges"]:
              print(f"  {r['start']} .. {r['end']}   {r['note']}")
          PY

      # Does the measured profile reproduce the reported GTA V crash?
      - name: Re-run the GTA V case against the MEASURED profile
        if: steps.rosetta.outputs.available == 'true'
        continue-on-error: true
        run: |
          build-x64/bin/rs-check contracts/gtav-rage-direct-memory-mapping.json \
            --profile macos-rosetta-x86_64.json || true
          echo
          echo "Against the reported-measurement fixture, for comparison:"
          build-x64/bin/rs-check contracts/gtav-rage-direct-memory-mapping.json \
            --profile profiles/fixtures/macos-arm64-rosetta-x86_64.reported.fixture.json \
            --quiet || true

      - name: Compare the measurement against the hand-authored fixture
        if: steps.rosetta.outputs.available == 'true'
        continue-on-error: true
        run: |
          echo "Differences between what we MEASURED and what the fixture CLAIMED:"
          build-x64/bin/rs-profile diff macos-rosetta-x86_64.json \
            profiles/fixtures/macos-arm64-rosetta-x86_64.reported.fixture.json || true

      - uses: actions/upload-artifact@v4
        if: always() && steps.measure.outcome == 'success'
        with:
          name: macos-rosetta-x86_64-profile
          path: macos-rosetta-x86_64.json

      # The development sandbox for this project can reach the repository over
      # the git protocol only - no Actions REST API, no artifact downloads. So
      # the two things worth reading are published as namespaced refs, which
      # are invisible as branches and trigger nothing:
      #
      #   refs/measurements/<sha>/<job>   the measured profile itself
      #   refs/status/<sha>/<job>/<state> the job's conclusion
      #
      # Fetch one with:
      #   git fetch origin "refs/measurements/<sha>/<job>:refs/heads/m" && git show m:PROFILE.json
      # Via the shared script, so this ref holds ONLY the artifacts. It used to
      # `git add` on top of the checked-out tree, which meant every measurement
      # ref carried a full copy of the repository - and the ground-truth output,
      # the thing this workflow exists to produce, was not in it at all.
      - name: Publish the measurement to refs/measurements/*
        if: always() && steps.measure.outcome == 'success'
        run: |
          bash tools/ci/publish_measurement.sh measurements \
            "rosetta-x86_64" "${{ github.sha }}" \
            macos-rosetta-x86_64.json /tmp/groundtruth.txt /tmp/reproducible.txt

      - name: Failure diagnostics -> refs/ci-logs/*
        if: failure()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          mkdir -p /tmp/diag
          echo "$STEPS_JSON" > /tmp/diag/steps.json
          ctest --test-dir build-x64 --build-config RelWithDebInfo \
            --rerun-failed --output-on-failure \
            > /tmp/diag/ctest_failed.txt 2>&1 || true
          tail -c 30000 /tmp/diag/ctest_failed.txt > /tmp/diag/ctest_tail.txt || true
          cp /tmp/reproducible.txt /tmp/diag/reproducible.txt 2>/dev/null \
            || echo "(the reproducibility step did not run)" > /tmp/diag/reproducible.txt
          cp /tmp/groundtruth.txt /tmp/diag/groundtruth.txt 2>/dev/null \
            || echo "(the ground-truth step did not run)" > /tmp/diag/groundtruth.txt
          git config user.name "ci-logs"
          git config user.email "ci-logs@localhost"
          git checkout --detach -q
          cp /tmp/diag/steps.json /tmp/diag/ctest_tail.txt \
             /tmp/diag/reproducible.txt /tmp/diag/groundtruth.txt .
          git add -f steps.json ctest_tail.txt reproducible.txt groundtruth.txt
          git commit -qm "macos diagnostics @ ${{ github.sha }}"
          git push --force origin \
            "HEAD:refs/ci-logs/${{ github.sha }}/rosetta-x86_64"

      - name: Mirror job status to refs/status/*
        if: always()
        run: |
          git push --force origin \
            "HEAD:refs/status/${{ github.sha }}/rosetta-x86_64/${{ job.status }}"
